seed: 123
num_steps_per_env: 32
max_iterations: 5000
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 250
experiment_name: g1_tracking
run_name: ft_walk_small_from_2999
logger: wandb
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: false
load_run: .*
load_checkpoint: model_.*.pt
clip_actions: null
upload_model: true
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 768
  - 384
  - 192
  activation: elu
  obs_normalization: true
  distribution_cfg:
    init_std: 1.0
    std_type: scalar
critic:
  hidden_dims: !!python/tuple
  - 768
  - 384
  - 192
  activation: elu
  obs_normalization: true
algorithm:
  num_learning_epochs: 8
  num_mini_batches: 8
  learning_rate: 0.0003
  schedule: adaptive
  gamma: 0.995
  lam: 0.95
  entropy_coef: 0.001
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  rnd_cfg: null
  symmetry_cfg: null
multi_gpu: null
